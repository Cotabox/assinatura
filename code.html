<div>
	<table id="sig" role="presentation" width="440" cellspacing="0" cellpadding="0" border="0" style="width:440px;border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;">
		<tr>
			<td style="padding:0 0 14px 0;">
				<a href="https://cotabox.com.br/" target="_blank" style="text-decoration:none;border:0;"><img id="logo" src="https://storage.googleapis.com/bkt-sandbox-email-assets/assinatura-logo-cotabox.png" width="120" height="23" alt="Cotabox" border="0" style="display:block;border:0;width:120px;height:23px;"></a>
			</td>
		</tr>
		<tr>
			<td style="padding:2px 0 2px 14px;border-left:3px solid #2f5cff;">
				<table role="presentation" cellspacing="0" cellpadding="0" border="0" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;">
					<tr>
						<td style="padding:0 0 2px 0;font-size:18px;line-height:22px;font-weight:bold;color:#141824;">${first} ${last}</td>
					</tr>
					<tr id="title">
						<td style="padding:0 0 10px 0;font-size:13px;line-height:18px;color:#5c6172;">${title}</td>
					</tr>
					<tr id="phone">
						<td style="padding:0 0 4px 0;font-size:12px;line-height:18px;color:#141824;">
							<span style="font-size:10px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;color:#2f5cff;">Telefone&nbsp;&nbsp;</span><a href="tel:${phone}" target="_blank" style="color:#141824;text-decoration:none;">${phone}</a>
						</td>
					</tr>
					<tr id="email">
						<td style="padding:0;font-size:12px;line-height:18px;color:#141824;">
							<span style="font-size:10px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;color:#2f5cff;">E-mail&nbsp;&nbsp;</span><a href="mailto:${email}" target="_blank" style="color:#141824;text-decoration:none;">${email}</a>
						</td>
					</tr>
				</table>
			</td>
		</tr>
		<tr>
			<td style="padding:16px 0 0 0;">
				<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;">
					<tr>
						<td style="padding:12px 0 0 0;border-top:1px solid #e5e7eb;font-size:12px;line-height:18px;">
							<a href="https://cotabox.com.br/" target="_blank" style="font-weight:bold;color:#2f5cff;text-decoration:none;">www.cotabox.com.br</a>
						</td>
					</tr>
					<tr>
						<td style="padding:4px 0 0 0;font-size:11px;line-height:16px;color:#7c828f;">Al. Vicente Pinzon, 54 · 5º Andar<br>Vila Olímpia, São Paulo - SP · CEP 04547-130</td>
					</tr>
				</table>
			</td>
		</tr>
	</table>
</div>
